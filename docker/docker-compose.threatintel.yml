version: '3.8'

services:
  sentinelai-threatintel:
    build:
      context: ..
      dockerfile: docker/threatintel/Dockerfile
    container_name: sentinelai-threatintel-service
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/threatintel/stats"]
      interval: 15s
      timeout: 5s
      retries: 3
