version: '3.8'

services:
  sentinel-tenant-engine:
    build:
      context: ..
      dockerfile: docker/tenant/Dockerfile
    container_name: sentinel-multitenant-saas
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=postgres://sentinel:SentinelSaaS2026!@postgres-db:5432/sentinel_tenants
    depends_on:
      postgres-db:
        condition: service_healthy
    restart: always
    networks:
      - sentinel-mesh

  postgres-db:
    image: postgres:15-alpine
    container_name: sentinel-postgres-multitenant
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: SentinelSaaS2026!
      POSTGRES_DB: sentinel_tenants
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../migrations/009_multitenant_postgresql.sql:/docker-entrypoint-initdb.d/009_multitenant.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel_tenants"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sentinel-mesh

networks:
  sentinel-mesh:
    driver: bridge

volumes:
  postgres_data:
