apiVersion: apps/v1
kind: Deployment
metadata:
  name: awm-autonomous-response-engine
  namespace: awm-cyber-security
  labels:
    app.kubernetes.io/name: awm-autonomous-engine
    app.kubernetes.io/part-of: awm-cyber-ai-xdr
    app.kubernetes.io/component: active-containment-engine
spec:
  replicas: 3
  selector:
    matchLabels:
      app: awm-autonomous-engine
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: awm-autonomous-engine
    spec:
      containers:
        - name: autonomous-engine
          image: gcr.io/awm-cyber-ai/autonomous-response-engine:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http-api
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: awm-ai-credentials
                  key: GEMINI_API_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: awm-db-credentials
                  key: DATABASE_URL
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2048Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1001
---
apiVersion: v1
kind: Service
metadata:
  name: awm-autonomous-response-service
  namespace: awm-cyber-security
  labels:
    app: awm-autonomous-engine
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      name: http
  selector:
    app: awm-autonomous-engine
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: awm-autonomous-engine-hpa
  namespace: awm-cyber-security
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: awm-autonomous-response-engine
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
