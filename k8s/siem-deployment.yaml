apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinelai-siem-deployment
  namespace: security-platform
  labels:
    app: sentinelai-siem
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sentinelai-siem
  template:
    metadata:
      labels:
        app: sentinelai-siem
    spec:
      containers:
      - name: siem-engine
        image: sentinelai/siem-engine:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: sentinel-secrets
              key: database-url
        - name: ELASTICSEARCH_URL
          value: "http://elasticsearch-service.security-platform.svc.cluster.local:9200"
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka-service.security-platform.svc.cluster.local:9092"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: sentinelai-siem-service
  namespace: security-platform
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
  selector:
    app: sentinelai-siem

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sentinelai-siem-hpa
  namespace: security-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sentinelai-siem-deployment
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
