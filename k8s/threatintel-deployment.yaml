apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinelai-threatintel-deployment
  namespace: sentinelai-security
  labels:
    app.kubernetes.io/name: sentinelai-threatintel
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sentinelai-threatintel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentinelai-threatintel
    spec:
      containers:
      - name: threatintel-engine
        image: sentinelai/threatintel-engine:v1.0.0
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: sentinelai-secrets
              key: GEMINI_API_KEY
        resources:
          limits:
            cpu: "1000m"
            memory: "1Gi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /api/threatintel/stats
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: sentinelai-threatintel-service
  namespace: sentinelai-security
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sentinelai-threatintel
  ports:
  - port: 3000
    targetPort: 3000
