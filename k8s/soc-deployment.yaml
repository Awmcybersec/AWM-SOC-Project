apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinelai-soc-command-center
  namespace: security-soc
  labels:
    app.kubernetes.io/name: sentinelai-soc
    app.kubernetes.io/component: xdr-command-center
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sentinelai-soc
  template:
    metadata:
      labels:
        app: sentinelai-soc
    spec:
      containers:
        - name: soc-app
          image: gcr.io/sentinelai-sec/soc-command-center:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: soc-secrets
                  key: GEMINI_API_KEY
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /api/soc/dashboard
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/soc/dashboard
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: sentinelai-soc-service
  namespace: security-soc
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      name: http
  selector:
    app: sentinelai-soc
